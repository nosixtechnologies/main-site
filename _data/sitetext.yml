        align: right

      - title: "Launch"
        # year: "2019"
        desc: "Hurrah! Today is the launch day. After four stages are completed we get approval from you to transfer it from local to online. We setup nice and fine server in place and make it live."
        image: assets/img/timeline/launch.png
        alt: image alt text
    end: "Be Part <br> of Our <br> Story!"

